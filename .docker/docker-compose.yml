services:
    db:
        image: mysql:8.0.33
        platform: linux/arm64/v8
        command: --default-authentication-plugin=mysql_native_password --bind-address=0.0.0.0 --skip-name-resolve
        ports:
            - "3306:3306"
        volumes:
            - "db_app:/var/lib/mysql"
            - "./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        networks:
            - symfony_app
    php:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                TIMEZONE: ${TIMEZONE}
        volumes:
            - .:/var/www/symfony:cached
            - symfony_app_var:/var/www/symfony/var
            - symfony_app_vendor:/var/www/symfony/vendor
        networks:
            - symfony_app
        environment:
            APP_ENV: ${APP_ENV:-prod}
    nginx:
        build:
            context: .
            dockerfile: .docker/nginx/Dockerfile
        volumes:
            - .:/var/www/symfony:cached
            - symfony_app_var:/var/www/symfony/var
            - symfony_app_vendor:/var/www/symfony/vendor
        expose:
            - 80
        networks:
            - symfony_app
            - coolify
        labels:
            - "coolify.managed=true"
            - "coolify.port=80"
            - "traefik.enable=true"
            - "traefik.http.routers.nginx.rule=Host(`d11ze6qbv2vwwatdgw22b2oe.89.168.97.22.sslip.io`)"
            - "traefik.http.routers.nginx.entrypoints=http"
            - "traefik.http.services.nginx.loadbalancer.server.port=80"
            - "traefik.docker.network=coolify"

volumes:
    symfony_app_var:
    symfony_app_vendor:
    db_app:

networks:
    symfony_app:
    coolify:
        external: true
